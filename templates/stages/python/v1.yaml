parameters:
- name: appVersion
  type: string

stages:
- stage: StageID_BuildAndTestProject
  displayName: 'Project: Build and Test'
  dependsOn: StageID_PreBuild
  jobs:
  - job: JobID_BuildAndTest
    displayName: 'Build and Test'
    variables:
      VERSION: ${{ parameters.appVersion }}
    steps:
    - script: |
        python -m pip install --upgrade pip
        pip install pytest pytest-azurepipelines httpx fastapi
        if [ -f users-api/requirements.txt ]; then pip install -r users-api/requirements.txt; fi
        
        export PYTHONPATH=$PYTHONPATH:$(Build.SourcesDirectory)/users-api
        
        python -m pytest users-api/tests/ --junitxml=$(System.DefaultWorkingDirectory)/test-results.xml
      displayName: 'Run Unit Tests'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(System.DefaultWorkingDirectory)/test-results.xml'
        mergeTestResults: true
        failTaskOnFailedTests: true
      displayName: 'Publish Unit Test Report'
