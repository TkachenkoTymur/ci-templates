parameters:
- name: appVersion
  type: string
- name: dockerId
  type: string
- name: dockerRepo
  type: string

stages:
- stage: StageID_BuildAndPushDockerImage
  displayName: 'Docker: Build and Push'
  dependsOn: StageID_BuildAndTestProject
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  jobs:
  - job: JobID_BuildAndPushDockerImage
    variables:
      VER: ${{ parameters.appVersion }}
    steps:
    - checkout: self
    - task: Docker@2
      displayName: 'Build and Push'
      inputs:
        containerRegistry: 'DockerHubConnection'
        repository: '${{ parameters.dockerId }}/${{ parameters.dockerRepo }}'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(VER)
